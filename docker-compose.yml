# Docker Compose configuration for deployment

networks:
  web:
    external: true
  backend:

volumes:
  codycolor-data:
    external: true
  codycolor-database:
    external: true

services:
  website:
    build: ./client
    networks:
      - web
    expose:
      - "80"
    depends_on:
    - server
    restart: unless-stopped
    env_file: ./config.env
    environment:
    - "RABBIT_SOCKET_URL=wss://codycolor.codyroby.it/api/ws"
    - "WEB_BASE_URL=https://codycolor.codyroby.it"
    volumes:
    - ./firebase-config.json:/firebase-config.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.codycolor-client.rule=Host(`codycolor.codyroby.it`)"
      - "traefik.http.routers.codycolor-client.entrypoints=web,websecure"
      - "traefik.http.routers.codycolor-client.middlewares=codycolor-client-redirectscheme"
      - "traefik.http.middlewares.codycolor-client-redirectscheme.redirectscheme.scheme=https"
      - "traefik.http.middlewares.codycolor-client-redirectscheme.redirectscheme.permanent=true"

  rabbit:
    image: beevelop/rabbitmq-stomp
    networks:
    - web
    - backend
    env_file: ./config.env
    expose:
    - "15674"
    logging:
      driver: "local"
      options:
        max-size: "30m"
        max-file: "2"
    restart: unless-stopped
    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=web"
    - "traefik.http.routers.codycolor-rabbit.rule=Host(`codycolor.codyroby.it`)&&PathPrefix(`/api`)"
    - "traefik.http.routers.codycolor-rabbit.entrypoints=websecure"
    - "traefik.http.routers.codycolor-rabbit.middlewares=codycolor-rabbit-stripprefix"
    - "traefik.http.middlewares.codycolor-rabbit-stripprefix.stripprefix.prefixes=/api"
    - "traefik.http.services.codycolor-rabbit.loadbalancer.server.port=15674"
    - "traefik.http.services.codycolor-rabbit.loadbalancer.server.scheme=http"

  server:
    build: ./server
    networks:
    - backend
    volumes:
    - codycolor-data:/data:rw
    env_file: ./config.env
    depends_on:
    - rabbit
    - database
    logging:
      driver: "local"
      options:
        max-size: "30m"
        max-file: "2"
    restart: unless-stopped

  database:
    image: mysql:5.7.44
    networks:
    - backend
    volumes:
    - codycolor-database:/var/lib/mysql:rw
    env_file: ./config.env
    logging:
      driver: "none"
    restart: unless-stopped

  database-client:
    build: ./database-operator
    depends_on:
    - database
    networks:
    - backend
    env_file: ./config.env
    logging:
      driver: "none"

  database-manager:
    image: phpmyadmin/phpmyadmin:5.2.3
    depends_on:
    - database
    networks:
    - web
    - backend
    env_file: ./config.env
    environment:
    - "PMA_HOST=database"
    - "UPLOAD_LIMIT=100M"
    - "PMA_ABSOLUTE_URI=https://codycolor.codyroby.it/phpmyadmin/"
    expose:
    - "80"
    stdin_open: true
    tty: true
    logging:
      driver: "none"
    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=web"
    - "traefik.http.routers.codycolor-phpmyadmin.rule=Host(`codycolor.codyroby.it`)&&PathPrefix(`/phpmyadmin/`)"
    - "traefik.http.routers.codycolor-phpmyadmin.entrypoints=websecure"
    - "traefik.http.routers.codycolor-phpmyadmin.middlewares=codycolor-phpmyadmin-stripprefix"
    - "traefik.http.middlewares.codycolor-phpmyadmin-stripprefix.stripprefix.prefixes=/phpmyadmin/"
    - "traefik.http.services.codycolor-phpmyadmin.loadbalancer.server.port=80"
    - "traefik.http.services.codycolor-phpmyadmin.loadbalancer.server.scheme=http"
