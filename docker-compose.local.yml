services:
  rabbit:
    image: beevelop/rabbitmq-stomp
    ports:
      - "15674:15674"
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  database:
    image: mysql:5.7.44
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: codycolor
      MYSQL_PASSWORD: codycolor
      MYSQL_DATABASE: codycolor
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - codycolor-database-local:/var/lib/mysql

  database-manager:
    image: phpmyadmin/phpmyadmin:5.2.3
    depends_on:
      - database
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
  server:
    build: ./server
    environment:
      HOST: rabbit
      PORT: 15674

      MYSQL_USER: codycolor
      MYSQL_PASSWORD: codycolor
      MYSQL_DATABASE: codycolor

    depends_on:
      - rabbit
      - database

volumes:
  codycolor-database-local:
