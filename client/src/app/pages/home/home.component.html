<div id="home" class="page">
  <header class="page--header">
    <h1 class="floating-up-animation ellipsize">
      {{ "APP_NAME_SHORT" | translate }}
    </h1>
  </header>

  <main class="page--body">
    <nav class="home-menu" aria-label="Main menu">
      <button class="navigation--button menu-element" routerLink="/rules">
        {{ "HOW_TO_PLAY" | translate }}
      </button>

      <button
        class="navigation--button menu-element"
        routerLink="/random-mmaking"
      >
        {{ "RANDOM_MATCH" | translate }}
      </button>

      <button
        class="navigation--button menu-element"
        routerLink="/custom-mmaking"
      >
        {{ "CUSTOM_MATCH" | translate }}
      </button>

      <button
        class="navigation--button menu-element"
        routerLink="/royale-mmaking"
      >
        {{ "AGA_MATCH" | translate }}
      </button>

      <button
        class="navigation--button menu-element"
        routerLink="/bootmp-mmaking"
      >
        {{ "BOOT_CAMP" | translate }}
      </button>

      <button class="navigation--button menu-element" routerLink="/rankings">
        {{ "RANKINGS" | translate }}
      </button>
    </nav>

    <section class="home-status" aria-live="polite">
      @if (brokerConnected) {
      <div class="flashing-animation mx-4">
        {{
          "NOTIF_GENERAL"
            | translate
              : {
                  totalMatches: totalMatches,
                  connectedPlayers: connectedPlayers
                }
        }}
      </div>
      } @else {
      <div class="flashing-animation">
        {{ "NOTIF_OFFLINE" | translate }}
      </div>
      }
    </section>
  </main>
</div>

@if (noOnlineModal) {
<div
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="no-connection-message"
>
  <div class="modal--content">
    <p id="no-connection-message">
      {{ noOnlineModalText }}
    </p>

    <div class="modal--buttons-container">
      <button
        class="modal--button-primary"
        type="button"
        (click)="closeNoConnectionModal()"
      >
        {{ "OK" | translate }}
      </button>
    </div>
  </div>
</div>
}
